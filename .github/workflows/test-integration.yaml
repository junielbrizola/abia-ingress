name: Integration Test
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    # Everything the test image is built from. A change to any of these can
    # alter the binary the suite exercises, and a path missing here means no
    # run at all rather than a run that passes.
    paths:
      - .github/workflows/test-integration.yaml
      - .golangci.yaml
      - .go-version
      - .gitmodules
      - .gst-version
      - build/test/**
      - cmd/**
      - pkg/**
      - test/**
      - version/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/realtime/ingress
    # The suite's own deadline is 20m, so this only catches a hang outside it.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [rtmp, url, whip]

    steps:
      # The WHIP publisher lives in the livekit-whip-bot submodule, which the
      # image builds. Without it every suite fails at build time, not just whip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          path: apps/realtime/ingress

      # The fixture builds the server fork from the same monorepo context as
      # ABIA's server image; these pins match the root repository gitlinks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: junielbrizola/abia-realtime-server
          ref: c5c8ec507dfec495e89eb64a3370645473d4f6b7
          token: ${{ secrets.ABIA_SUBMODULES_READ_TOKEN || github.token }}
          path: apps/realtime/server

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: junielbrizola/abia-protocol
          ref: 36e1b27375d9f560868642642bdd0f669a610756
          token: ${{ secrets.ABIA_SUBMODULES_READ_TOKEN || github.token }}
          path: apps/realtime/protocol

      - name: Read the pinned GStreamer version
        id: gst-version
        run: |
          version=$(cat .gst-version)
          if [ -z "$version" ]; then echo ".gst-version is empty" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write the ${{ matrix.suite }} config
        run: |
          cat > /tmp/ingress-integration.yaml <<EOF
          logging:
            level: debug
          redis:
            address: redis:6379
          api_key: devkey
          api_secret: secret
          ws_url: ws://livekit:7880
          room_name: ingress-integration-${{ matrix.suite }}
          EOF

      - name: Build the ${{ matrix.suite }} suite images
        env:
          INGRESS_TEST_CONFIG: /tmp/ingress-integration.yaml
          GSTVERSION: ${{ steps.gst-version.outputs.version }}
          SECURITY_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f build/test/compose.yaml build livekit test

      - name: Run the ${{ matrix.suite }} suite
        env:
          INTEGRATION_TYPE: ${{ matrix.suite }}
          INGRESS_TEST_CONFIG: /tmp/ingress-integration.yaml
          GSTVERSION: ${{ steps.gst-version.outputs.version }}
          SECURITY_REFRESH: ${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f build/test/compose.yaml run --rm test

      # Compose interpolates the whole file whatever the command, so this
      # needs the same variables the run step does or it fails instead of
      # printing the logs a red run is here to explain.
      - name: Room server log
        if: failure()
        env:
          INGRESS_TEST_CONFIG: /tmp/ingress-integration.yaml
          GSTVERSION: ${{ steps.gst-version.outputs.version }}
        run: docker compose -f build/test/compose.yaml logs livekit
